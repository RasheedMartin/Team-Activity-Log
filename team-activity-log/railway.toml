# Railway config-as-code for the backend service. In the service's Settings set
# Root Directory = team-activity-log so this file and the Dockerfile are used.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'tal migrate && tal serve --port $PORT'"
healthcheckPath = "/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
