name: frontend

on:
  push:
    branches: [main]
    paths: ["team-activity-log/frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["team-activity-log/frontend/**", ".github/workflows/frontend.yml"]

defaults:
  run:
    working-directory: team-activity-log/frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: team-activity-log/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook -- --quiet

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: team-activity-log/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: team-activity-log/frontend/playwright-report
